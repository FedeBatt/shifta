services:
  postgres:
    image: postgres:16-alpine
    container_name: shiter-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shiter
    volumes:
      - shiter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d shiter']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shiter_pgdata:
